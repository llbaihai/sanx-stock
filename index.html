<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>San-X 库存查询</title><style>body{font-family:system-ui;background:#f4f7fb;margin:0;padding:20px;color:#243044}main{max-width:620px;margin:auto;background:#fff;padding:24px;border-radius:16px}h1{font-size:24px}input,button{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;font-size:16px}input{border:1px solid #ccd3df}button{margin-top:10px;border:0;background:#2f6fed;color:white;font-weight:700}.card{margin-top:18px;padding:14px;background:#f4f7fb;border-radius:9px;line-height:1.8}.error{color:#c62828}</style><main><h1>San-X 库存查询</h1><p>手机输入商品详情页网址即可查询。</p><input id="url" placeholder="https://shop.san-x.co.jp/jp/product_list/details/208971"><button id="go">查询库存</button><div id="out" class="card">等待查询…</div></main><script>const API='https://sanx-stock-api.2960689314.workers.dev/api/stock';const $=id=>document.getElementById(id);$('go').onclick=async()=>{let url=$('url').value.trim();$('out').textContent='查询中…';try{let r=await fetch(API+'?url='+encodeURIComponent(url)),d=await r.json();if(!r.ok)throw Error(d.error);$('out').innerHTML='<b>'+safe(d.name)+'</b><br>SKU：'+safe(d.sku)+'<br>库存：<strong>'+d.virtual_stock+'</strong><br>限购：'+(d.purchase_limit??'未设置')}catch(e){$('out').className='card error';$('out').textContent=e.message}};function safe(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</script></html>
