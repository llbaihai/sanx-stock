<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>San-X库存查询</title><style>body{font:16px system-ui;background:#f4f7fb;padding:20px}main{max-width:620px;margin:auto;background:#fff;padding:24px;border-radius:16px}input,button{width:100%;box-sizing:border-box;padding:13px;margin-top:10px;border-radius:9px;font-size:16px}button{border:0;background:#2f6fed;color:#fff;font-weight:700}.card{margin-top:18px;padding:14px;background:#f4f7fb;border-radius:9px}.error{color:#c62828}</style><main><h1>San-X库存查询</h1><input id="p" type="password" placeholder="访问密码"><input id="u" placeholder="San-X商品网址"><button id="b">查询库存</button><div id="o" class="card">等待查询…</div></main><script>const $=x=>document.getElementById(x);b.onclick=async()=>{try{let r=await fetch("https://sanx-stock-api.2960689314.workers.dev/api/stock?url="+encodeURIComponent(u.value)+"&password="+encodeURIComponent(p.value)),d=await r.json();if(!r.ok)throw Error(d.error);o.textContent="库存："+d.virtual_stock}catch(e){o.className="card error";o.textContent=e.message}}</script>
